name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR supersedes the running checks
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  SF_DISABLE_AUTOUPDATE: 'true'
  SF_DISABLE_TELEMETRY: 'true'

jobs:
  static:
    name: Format, lint, LWC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run prettier:verify
      - run: npm run lint
      # sfdx-lwc-jest passes arguments after its own "--" through to Jest
      - run: npm run test:unit -- -- --passWithNoTests

  analyze:
    name: Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # The PMD engine (Apex rules) runs on Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Salesforce CLI and Code Analyzer
        run: |
          npm install --global @salesforce/cli@2.155.7
          sf plugins install code-analyzer@5.14.0

      # Fails on severity 1 (Critical) and 2 (High); rule choices are in code-analyzer.yml
      - name: Run Code Analyzer
        run: >
          sf code-analyzer run
          --config-file code-analyzer.yml
          --workspace force-app
          --rule-selector Recommended
          --severity-threshold 2
          --view table
          --output-file code-analyzer-results.json
          --output-file code-analyzer-results.html

      - name: Analysis summary
        if: always()
        run: node .github/scripts/code-analyzer-summary.js code-analyzer-results.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: code-analyzer-results
          path: code-analyzer-results.html
          if-no-files-found: ignore

  validate:
    name: Validate deploy + Apex tests
    runs-on: ubuntu-latest
    # Secrets are not passed to PRs from forks, so only validate PRs from this repository
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    # The org runs one deployment at a time; queue behind any running validation or deploy
    concurrency:
      group: orderhub-org
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/sf-setup
        with:
          sfdx-auth-url: ${{ secrets.SFDX_AUTH_URL }}

      - name: Validate deployment and run local tests
        env:
          # Running user of the webhook subscriber; replaced into its config (sfdx-project.json)
          SF_INTEGRATION_USERNAME: ${{ secrets.SF_INTEGRATION_USERNAME }}
        run: >
          sf project deploy validate
          --source-dir force-app
          --target-org orderhub
          --test-level RunLocalTests
          --coverage-formatters json-summary
          --results-dir test-results
          --wait 30

      - name: Coverage summary
        if: always()
        run: node .github/scripts/coverage-summary.js test-results/coverage/coverage-summary.json >> "$GITHUB_STEP_SUMMARY"
